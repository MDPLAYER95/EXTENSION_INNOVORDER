<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <title>Filtre produits Innovorder</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <h1>Filtre produits</h1>
    <form id="add-form">
      <input id="product-input" type="text" placeholder="Nom du produit (ex: frite)" autocomplete="off">
      <button type="submit">Ajouter</button>
    </form>
    <label class="toggle-option">
      <input type="checkbox" id="auto-print-toggle">
      <span>Imprimer automatiquement la commande quand un produit passe en préparation</span>
    </label>
    <p id="auto-print-help" class="toggle-help">Une page d'impression s'ouvrira dès qu'un article passe au statut "en cours".</p>
    <label class="toggle-option">
      <input type="checkbox" id="product-timer-toggle">
      <span>Activer le minuteur et l'alerte visuelle/sonore pour les produits chronométrés</span>
    </label>
    <p id="product-timer-help" class="toggle-help">À l'expiration du minuteur, le produit clignote en rouge et un bip de 2&nbsp;secondes est joué.</p>
    <ul id="product-list"></ul>
    <p id="empty-help">Aucun filtre : tous les tickets sont visibles.</p>
    <section id="reference-section" hidden>
      <h2>Références rapides</h2>
      <ul id="reference-list"></ul>
    </section>
    <script src="popup.js"></script>
  </body>
</html>
